name: Deploy site to Cloudflare Pages

# Production: https://doerflow-site.pages.dev (no branch prefix)
# Custom domain: doerflow.dev
# Project: https://dash.cloudflare.com/af0e854078b49637d63673c75566906b/pages/view/doerflow-site
#
# Secrets (org or repo — org-level is enough if granted to this repo):
#   CLOUDFLARE_API_TOKEN  — Account · Cloudflare Pages · Edit
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24.11'
          cache: pnpm

      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN (org or repo secret). Grant the org secret to doerflow/site at https://github.com/organizations/doerflow/settings/secrets/actions"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID (org or repo secret)."
            missing=1
          fi
          exit $missing

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build static site
        run: pnpm build
        env:
          NODE_ENV: production

      # No --branch: production deploy → doerflow-site.pages.dev (not main.doerflow-site.pages.dev)
      # Use npx (not wrangler-action) to avoid npm install into a pnpm workspace.
      - name: Publish to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.20.0 pages deploy out --project-name=doerflow-site
